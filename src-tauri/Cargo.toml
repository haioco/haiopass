[package]
name = "haio-bypass"
version = "4.0.0"
edition = "2021"

[lib]
name = "haio_bypass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dirs = "5"
urlencoding = "2"
sha2 = "0.10"
# In-process Trojan client TLS stack. Versions/providers are pinned to what
# reqwest already resolves (rustls 0.23 + ring); enabling aws-lc-rs as well
# would compile two CryptoProviders in and break rustls at runtime.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Native Windows Credential Manager. Without this feature keyring falls back to
# its in-process mock store and tokens would not survive a restart.
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service (GNOME Keyring / KWallet bridge) with a pure-Rust crypto
# backend. `linux-native` (kernel session keyring) is deliberately NOT used: it
# does not survive a reboot.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
