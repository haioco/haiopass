name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Download bundled haio-proxy binaries
        shell: bash
        run: bash scripts/fetch-trojan.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build with Tauri (uploads all artifacts to a draft release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key (for signed update manifests)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: 'HaioBypass ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true

  sign-windows:
    # Replaces the unsigned Windows assets on the draft release with
    # Authenticode-signed versions from SignPath Foundation (free for OSS).
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the draft release's Windows assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "${{ github.ref_name }}" \
            --repo haioco/haiopass \
            --dir artifacts \
            --pattern '*.exe' --pattern '*.msi' --clobber
          ls -la artifacts/

      - name: Upload unsigned Windows artifacts (for SignPath)
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: artifacts/*
          if-no-files-found: error

      - name: Submit Windows artifacts to SignPath for code signing
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'haiobypass'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace draft-release Windows assets with signed versions
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the unsigned assets from the draft release, then upload the signed ones.
          $assets = gh release view $env:GITHUB_REF_NAME --repo haioco/haiopass --json assets --jq '.assets[].name'
          foreach ($name in $assets) {
            if ($name -match '\.(exe|msi)$') {
              gh release delete-asset $env:GITHUB_REF_NAME $name --repo haioco/haiopass --yes
            }
          }
          Get-ChildItem -Path signed -Recurse -File | ForEach-Object {
            gh release upload $env:GITHUB_REF_NAME $_.FullName --repo haioco/haiopass --clobber
          }

  publish:
    needs: [build, sign-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (for tauri signer)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate + upload signed updater manifest (latest.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/generate-updater-json.sh

      - name: Update release to published
        run: |
          gh release edit ${{ github.ref_name }} --repo haioco/haiopass --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
