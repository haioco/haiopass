name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            variant: win10
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            variant: win7
            config: src-tauri/tauri.win7.conf.json
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Download bundled haio-proxy binaries
        shell: bash
        run: bash scripts/fetch-trojan.sh

      - name: Prepare fixed WebView2 runtime (win10 variant)
        if: matrix.variant == 'win10'
        shell: bash
        run: |
          bash scripts/fetch-webview2-fixed.sh || echo "⚠ WebView2 fixed runtime download failed"
          ls -lh resources/webview2/ || true
          # fixedRuntime mode requires a COMPLETE staged runtime dir. Checking
          # only that the dir is non-empty once let a rejected runtime ship and
          # break every Windows 10 launch. Verify the payload files the WebView2
          # loader actually needs.
          DIR=resources/webview2/WebView2FixedRuntime
          MISSING=""
          # msedge.dll exists only in 109; EBWebView/ only in 128+. These three
          # are present in every fixed-runtime package.
          for f in msedgewebview2.exe resources.pak icudtl.dat; do
            [ -f "$DIR/$f" ] || MISSING="$MISSING $f"
          done
          COUNT=$(find "$DIR" -type f 2>/dev/null | wc -l | tr -d ' ')
          [ "${COUNT:-0}" -ge 30 ] || MISSING="$MISSING (only $COUNT files)"
          if [ ! -d "$DIR" ] || [ -n "$MISSING" ]; then
            echo "✗ WebView2 fixed runtime incomplete at $DIR — missing:$MISSING"
            echo "✗ win10 build cannot proceed (app would fail with 'Could not find the WebView2 Runtime')"
            exit 1
          fi
          echo "✓ WebView2 fixed runtime staged and verified"

      - name: Prepare Windows 7 offline WebView2 109 (win7 variant)
        if: matrix.variant == 'win7'
        shell: bash
        run: |
          bash scripts/fetch-webview2-109.sh || echo "⚠ WebView2 109 download failed — build will use placeholder, manually populate resources/webview2/"
          ls -lh resources/webview2/ || true
          # Win7 trojan-go must be Go 1.20-built; if docker available rebuild, else reuse existing
          if command -v docker >/dev/null 2>&1; then
            bash scripts/build-trojan-win7.sh || echo "⚠ Win7 trojan rebuild failed, using existing binary"
          fi
          ls -lh resources/trojan-go/
          # Same completeness gate as the win10 variant: a non-empty dir is not
          # a usable fixed runtime.
          DIR=resources/webview2/WebView2FixedRuntime109
          MISSING=""
          # msedge.dll exists only in 109; EBWebView/ only in 128+. These three
          # are present in every fixed-runtime package.
          for f in msedgewebview2.exe resources.pak icudtl.dat; do
            [ -f "$DIR/$f" ] || MISSING="$MISSING $f"
          done
          COUNT=$(find "$DIR" -type f 2>/dev/null | wc -l | tr -d ' ')
          [ "${COUNT:-0}" -ge 30 ] || MISSING="$MISSING (only $COUNT files)"
          if [ ! -d "$DIR" ] || [ -n "$MISSING" ]; then
            echo "✗ WebView2 109 fixed runtime incomplete at $DIR — missing:$MISSING"
            echo "✗ win7 build cannot proceed (app would fail with 'Could not find the WebView2 Runtime')"
            exit 1
          fi
          echo "✓ WebView2 109 fixed runtime staged and verified"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build with Tauri (uploads all artifacts to a draft release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key (for signed update manifests)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          args: --target ${{ matrix.target }} ${{ matrix.config && format('--config {0}', matrix.config) || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: 'HaioBypass ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true

  sign-windows:
    # Replaces the unsigned Windows assets on the draft release with
    # Authenticode-signed versions from SignPath Foundation (free for OSS).
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the draft release's Windows assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "${{ github.ref_name }}" \
            --repo haioco/haiopass \
            --dir artifacts \
            --pattern '*.exe' --pattern '*.msi' --clobber
          ls -la artifacts/

      - name: Upload unsigned Windows artifacts (for SignPath)
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: artifacts/*
          if-no-files-found: error

      - name: Submit Windows artifacts to SignPath for code signing
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'haiobypass'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace draft-release Windows assets with signed versions
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the unsigned assets from the draft release, then upload the signed ones.
          $assets = gh release view $env:GITHUB_REF_NAME --repo haioco/haiopass --json assets --jq '.assets[].name'
          foreach ($name in $assets) {
            if ($name -match '\.(exe|msi)$') {
              gh release delete-asset $env:GITHUB_REF_NAME $name --repo haioco/haiopass --yes
            }
          }
          Get-ChildItem -Path signed -Recurse -File | ForEach-Object {
            gh release upload $env:GITHUB_REF_NAME $_.FullName --repo haioco/haiopass --clobber
          }

  publish:
    needs: [build, sign-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (for tauri signer)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate + upload signed updater manifest (latest.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/generate-updater-json.sh

      - name: Verify win10 and win7 assets did not collide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The win10 and win7 variants must produce DIFFERENT installer names.
          # They once shared productName+version, so both matrix jobs uploaded the
          # identical asset name and one silently overwrote the other — Windows 10
          # users received the Win7 binary, which hard-requires a WebView2 109
          # fixed runtime and failed at every launch.
          ASSETS=$(gh release view "${{ github.ref_name }}" --repo haioco/haiopass --json assets --jq '.assets[].name')
          echo "assets:"; echo "$ASSETS"

          WIN10=$(echo "$ASSETS" | grep -E '^HaioBypass_[0-9][^_]*_x64-setup\.exe$' || true)
          WIN7=$(echo "$ASSETS" | grep -E '^HaioBypassWin7_[0-9][^_]*_x64-setup\.exe$' || true)

          if [ -z "$WIN10" ]; then
            echo "✗ win10 installer (HaioBypass_<ver>_x64-setup.exe) not found"
            exit 1
          fi
          if [ -z "$WIN7" ]; then
            echo "✗ win7 installer (HaioBypassWin7_<ver>_x64-setup.exe) not found —"
            echo "  the win7 matrix job produced no distinct artifact"
            exit 1
          fi

          DUPES=$(echo "$ASSETS" | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "✗ duplicate asset names in release: $DUPES"
            exit 1
          fi
          echo "✓ win10 and win7 assets are distinct: '$WIN10' / '$WIN7'"

      - name: Update release to published
        run: |
          gh release edit ${{ github.ref_name }} --repo haioco/haiopass --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
